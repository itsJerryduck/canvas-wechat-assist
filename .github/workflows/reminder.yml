name: Canvas 日课提醒

on:
  # UTC 00:00 = 北京时间 08:00 ；UTC 12:00 = 北京时间 20:00
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    # 这里把 Secrets 映射成环境变量，下面的 if 才能判断"该步骤要不要跑"
    env:
      CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      QUEST_WORKER_URL: ${{ secrets.QUEST_WORKER_URL }}
      QUEST_WORKER_KEY: ${{ secrets.QUEST_WORKER_KEY }}
      TZ_NAME: Asia/Shanghai
      LOOKAHEAD_DAYS: '7'
      MAIN_QUEST_HOURS: '72'
      SEND_WHEN_EMPTY: 'true'
      IGNORE_KEYWORDS: 'office hours,officehour,答疑'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 只有在配置了 Telegram 相关 Secret 时才执行（路线 B）
      - name: 推送到 Telegram
        if: env.QUEST_WORKER_URL != ''
        run: python telegram_push.py

      # 只有在配置了 Server酱 时才执行（路线 A）
      - name: 推送到微信
        if: env.SERVERCHAN_SENDKEY != ''
        run: python main.py
